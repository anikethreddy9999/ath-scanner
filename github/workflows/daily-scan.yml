name: daily-scan

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 16:00 IST, Mon-Fri, after the NSE close
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      always:
        description: "Send a Telegram message even if nothing is new (good for testing)"
        type: boolean
        default: true

permissions:
  contents: write             # only used for the monthly keep-alive commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance pandas numpy

      - name: Run scanner
        # --public keeps your holdings off the published dashboard.
        # Sell alerts still reach you through Telegram.
        run: python scanner.py --tickers-file my_stocks.txt --notify --public ${{ github.event.inputs.always == 'true' && '--always' || '' }}
        env:
          HOLDINGS: ${{ vars.HOLDINGS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive
        # GitHub pauses scheduled runs in public repos after 60 days without commits.
        run: |
          month=$(date +%Y-%m)
          if [ "$(cat heartbeat.txt 2>/dev/null)" != "$month" ]; then
            echo "$month" > heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "heartbeat $month"
            git push
          fi

      - name: Tell me if the run failed
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="ATH scanner run failed today. Open the Actions tab in your repo to see why."
